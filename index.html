<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painéis Financeiros — Central</title>
<style>
  :root{
    --bg:#0F1420;--bar:#161C2C;--line:#242C40;--ink:#F1F4F9;--muted:#9AA6BC;
    --primary:#3B6BF6;--primary-ink:#EAF0FF;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    display:flex;flex-direction:column;height:100vh;overflow:hidden}

  header{background:var(--bar);border-bottom:1px solid var(--line);
    padding:14px 20px 0;flex:none}
  .title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
  .title-row h1{font-size:16px;font-weight:800;letter-spacing:-.01em;margin:0;display:flex;align-items:center;gap:9px}
  .title-row h1 .sq{width:9px;height:9px;border-radius:3px;background:var(--primary);display:inline-block}
  .title-row .hint{font-size:12px;color:var(--muted)}

  nav.tabs{display:flex;gap:4px}
  nav.tabs button{
    background:transparent;border:0;color:var(--muted);font:inherit;font-size:13.5px;font-weight:700;
    padding:11px 18px;cursor:pointer;border-radius:10px 10px 0 0;position:relative;top:1px;
    transition:color .15s;display:flex;align-items:center;gap:8px}
  nav.tabs button:hover{color:var(--ink)}
  nav.tabs button.active{color:var(--ink);background:var(--bg);border:1px solid var(--line);border-bottom-color:var(--bg)}
  nav.tabs button .dot{width:6px;height:6px;border-radius:50%;flex:none}

  main{flex:1;min-height:0;position:relative;background:var(--bg)}
  .frame-wrap{position:absolute;inset:0;display:none}
  .frame-wrap.active{display:block}
  iframe{width:100%;height:100%;border:0;display:block;background:#EEF1F6}

  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:13px;font-weight:600;gap:10px}
  .loading .spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);
    border-top-color:var(--primary);animation:sp 0.8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

  </nav>
</header>

const loaded = [false, false, false, false];

function showTab(i){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("active", +b.dataset.i===i));
  document.querySelectorAll(".frame-wrap").forEach(w=>w.classList.toggle("active", +w.dataset.i===i));
  ensureLoaded(i);
}
function ensureLoaded(i){
  if(loaded[i]) return;
  const ifr = document.getElementById("if"+i);
  ifr.addEventListener("load", ()=>{
    const l = document.getElementById("load"+i);
    if(l) l.style.display = "none";
  }, {once:true});
  ifr.src = PANELS[i];
  loaded[i] = true;
}
document.querySelectorAll("nav.tabs button").forEach(b=>{
  b.addEventListener("click", ()=>showTab(+b.dataset.i));
});

ensureLoaded(0); // carrega o primeiro painel imediatamente
